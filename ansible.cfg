[defaults]
inventory = inventory/generate_inventory
# interpreter_python=/usr/bin/python3
# increase SSH timeout
timeout=30
# Decrypt SOPS-encrypted *.sops.yml files in host_vars/ and group_vars/ (needs sops + your age key)
vars_plugins_enabled = host_group_vars, community.sops.sops
# Retain old behaviour, see https://forum.ansible.com/t/inject-facts-as-vars-is-defaulting-to-false-in-2-24/44886/1
inject_facts_as_vars = True
