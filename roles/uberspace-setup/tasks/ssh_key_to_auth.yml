---
- name: Construct SSH key file path - {{ item.file }}
  set_fact:
    ssh_key_file_path: "/home/{{ uberspace_user }}/.ssh/{{ item.file | regex_replace('.pub$', '') }}.pub"

- name: Read provided SSH key file from remote - {{ item.file }}
  ansible.builtin.slurp:
    src: "{{ ssh_key_file_path }}"
  register: ssh_key_file

- name: Add SSH key from file to authorized keys - {{ item.file }}
  ansible.builtin.authorized_key:
    user: "{{ uberspace_user }}"
    state: "{{ item.state | default('present') }}"
    key: "{{ ssh_key_file.content | b64decode }}"
